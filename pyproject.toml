[project]
name = "hpcdiag"
version = "0.0.1"
description = "Statistically guaranteed, cost-aware diagnosis of degraded HPC compute nodes from Slurm job logs"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "duckdb==1.5.6",
    "h5py==3.16.0",
    "lightgbm==4.7.0",
    "matplotlib==3.11.2",
    "numpy==2.4.6",
    "pandas==3.0.6",
    "pyarrow==26.0.0",
    "pyyaml==6.0.3",
    "scikit-learn==1.9.1",
    "scipy==1.17.1",
    "sortedcontainers==2.4.0",
    "tqdm==4.70.1",
    "xgboost==3.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hpcdiag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["realdata: tests that read the raw/processed datasets (slow)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[dependency-groups]
dev = [
    "hypothesis==6.168.5",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.ruff.lint.per-file-ignores]
# Phase 6 kit: stand-alone scripts with long usage lines in docstrings; runs on target Pythons < 3.11
"cluster/*.py" = ["E501"]
"tests/test_cluster_kit.py" = ["E501"]
