# Phase 5 — Layer 3 v2 probe model (docs/PHASE5_DESIGN.md §2-§4). All of it is [A] or [D]: simulation.
seed: 0
layer2_config: configs/phase4_layer2.yaml

probes:                                  # §2; larger x = worse; log x ~ N(k log s, sigma^2)
  names: [cpu, mbw, cache, mem]
  cost_s: {cpu: 20, mbw: 20, cache: 20, mem: 1}
  sigma: 0.05
  k:                                     # rows: cause; columns: probes
    cpu:   {cpu: 1.0, mbw: 0.1, cache: 0.3, mem: 0.0}
    cache: {cpu: 0.3, mbw: 0.0, cache: 1.0, mem: 0.0}
    mbw:   {cpu: 0.1, mbw: 1.0, cache: 0.3, mem: 0.0}
    mem:   {cpu: 0.0, mbw: 0.1, cache: 0.0, mem: 0.0}
  mem_fixed_shift: 0.5                   # cause mem on probe mem: fixed, not scaled by s

evalue:                                  # §3 as amended by D87
  n_pool: 1000
  beta: 0.9
  bet_s0: 1.3
  edges: [0, 0.001, 0.002, 0.005, 0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1]
  bet_pools: 2000                        # g_{a,h} is built over independent pools (D87)
  pool_seed: 7001                        # the fixed healthy pool of each probe (D88)

policy:                                  # §4, D86, D89, D90
  s_grid: [1.1, 1.2, 1.3, 1.5, 2.0, 3.0]
  pi0_h0: 0.5
  tau: 0.95
  exclude_days: 7
  gh_nodes: 11
  tel_cost_s: 60
  tel_correct: 0.80                      # design confusion [A], only if no measured matrix is given
  tel_confused: 0.08
  tel_healthy: 0.96

budget_check:                            # planning numbers only; development seeds
  pool_draws: 2000
  mc_draws: 200000
  s: [1.1, 1.3, 2.0, 3.0]
  layer2_seeds: [0, 1, 2, 3, 4]
  layer2_K_pct: 1
  layer2_s: [1.3, 2.0]
  offsets_days: [7, 14]

grid:                                    # design §5-§6, D86, D91; development only (D77)
  budgets_ours: [60, 300, 1800, 7200]
  budgets_baselines: [60, 300, 1800]
  validity_kinds: ["null", user_decoy, user_decoy_heavy, system_shock]
  sens_budget: 300
  sens_variants: [n_pool_200, pool_redraw, sigma_0.1, k_primary_2, pi0_0.1, pi0_0.9, misspec,
                  tel_crossblock, tel_design, tel_transfer]
  sens_rules: [ours_design_rule, ours_skipdone]
  sens_validity_variants: [n_pool_200, pool_redraw, misspec]

antarex:                                 # D94
  blocks:
    - {name: mono, dir: data/interim/antarex/mono/results,
       labels: labels_injection-mono_workload-129.132.24.206_30000.csv}
    - {name: multi, dir: data/interim/antarex/multi/results_cpu-mem-multi,
       labels: labels_injection-multi_workload-129.132.24.206_30000.csv}
  rf:                                    # fixed before any result; no tuning
    n_estimators: 300
    class_weight: balanced
    n_jobs: 7
    n_folds: 5                           # contiguous time segments
    purge_s: 3600
    forward_train_share: 0.6

telemetry:                               # D94; rows true class, columns predicted: h0, cpu, cache, mbw, mem
  counts: [[20039, 0, 0, 0, 0], [0, 1560, 0, 0, 0], [0, 0, 1617, 0, 0], [0, 0, 0, 1513, 0], [0, 0, 0, 0, 1630]]     # main: out-of-fold, run 20261102-003936-classifier
  crossblock_counts: [[13318, 4906, 1815, 0, 0], [0, 1525, 35, 0, 0], [175, 453, 989, 0, 0], [0, 0, 0, 1500, 13], [0, 0, 0, 0, 1630]]     # sensitivity: train one block, test the other, both directions summed, run 20261102-004249-d94-diag

prodigy:                                 # D99 secondary binary check, reported only
  dir: data/interim/prodigy              # extracted from data/raw/prodigy/eclipse_small_prod_dataset.tar
  files: [[prod_train_data.hdf, prod_train_data, prod_train_label.csv],
          [prod_test_data.hdf, prod_test_data, prod_test_label.csv]]
  n_folds: 5                             # grouped by job_id; settings fixed before any result
  cumulative_share: 0.9                  # metric differenced if a counter in >= 90% of samples

grid5b:                                  # Phase 5b development grid (D95-D98, D103); seeds 0-19 only
  budgets: [0, 60, 300, 1800, 7200]
  probe_rules: [ig, stage]               # D97 comparison
  validity_kinds: ["null", user_decoy, user_decoy_heavy, system_shock]
  d86_budgets: [300, 1800, 7200]         # the architect's failed rule, reported row
  design_rule_budgets: [300, 7200]
  k1_variants: [tel_oof]                 # D98 sensitivity
  k1_variant_budgets: [300, 1800, 7200]
  misspec_variants: [misspec]
  misspec_budgets: [300, 7200]
  real_budgets: [300, 7200]
