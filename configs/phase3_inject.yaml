# Phase 3 — semi-synthetic ground truth on PM100.
# Sources: PLAN.md §9 Phase 3, §3.1 truth contract; D29–D35 (PROMPT 3 + addendum A1–A5 + answers).
seed: 0                                  # global seed (numpy/random); scenario RNGs are keyed below

raw_dir: data/raw
checksums_file: data/raw/CHECKSUMS.txt

data:
  jobs: data/processed/jobs_pm100.parquet
  job_nodes: data/processed/job_nodes_pm100.parquet
  out_dir: data/processed/scenarios
  # Mode E freeze time comes from the Phase 2 PM100 Mode E main run (L = 45, D18):
  freeze_from_run: runs/phase2/20261010-003334-pm100-E-main-full/metrics.json
  # submission gaps listed in docs/data_cards/pm100.md (profile run that generated the card):
  gaps_from_run: runs/phase0/20261009-233441-profile/metrics.json

eligible_states: [COMPLETED, TIMEOUT]    # D34: only these rows can be affected
main_population_min_run_time_s_exclusive: 30   # D17; applied AFTER injection (Phase 4 re-filters)

onset:                                   # D31, D34
  after_freeze_days: 7
  before_trace_end_days: 14              # trace end = max end_time of eligible rows
  max_redraws: 1000

kinds:
  node:          {k_pct: [1, 2, 5], s: [1.1, 1.2, 1.3, 1.5], s_extra: [2.0, 3.0]}   # s_extra: D63
  node_partial:  {k_pct: [1, 2, 5], s: [1.1, 1.2, 1.3, 1.5]}   # T' = T (1 + (s - 1) phi)
  user_decoy:    {s: [1.1, 1.2, 1.3, 1.5], min_user_jobs_after_t0: 50}
  system_shock:  {s: [1.1, 1.2, 1.3, 1.5], window_hours: 6}
  user_decoy_heavy: {s: [1.1, 1.2, 1.3, 1.5], top_users: 10}  # D36 (added after Phase 3 review)
  null: {}                               # D35: no injection, one per base

causes: [cpu, cache, mbw]                # D30, balanced (equal mix) per scenario, seeded

bases:                                   # D29, D35
  random_seeds: 20                       # random-placement bases 0..19; scenario seed k uses base k
  extra_null_random_seeds: [20, 200]     # D37: null-only bases 20..199 (placement tables only)
  real: true

seeds: 20                                # scenario seeds 0..19 per (kind, K, s, base)
