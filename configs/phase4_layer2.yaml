# Phase 4 — Layer 2: node e-processes and e-BH on PM100 scenarios.
# Sources: PLAN.md §9 Phase 4 (4.1–4.5, Gate 4a/4b); F13–F17; D22, D27, D28, D38–D58.
seed: 0
theta_seed: 12345                         # theta keyed by row_id (D44 plan): same theta per job in every scenario

raw_dir: data/raw
checksums_file: data/raw/CHECKSUMS.txt

data:
  jobs: data/processed/jobs_pm100.parquet
  scenarios: data/processed/scenarios
  phase2_config: configs/phase2_conformal.yaml          # features, LightGBM settings, L = 45
  phase2_mode_e_run: runs/phase2/20261010-003334-pm100-E-main-full   # frozen model reference (q_hat check)
  cache_dir: data/interim/phase4

population:
  states: [COMPLETED, TIMEOUT]
  min_run_time_s_exclusive: 30            # D17, applied AFTER injection (D34)

layer1:                                   # D22, D28, D38
  window_hours: 168                       # Mode P, W = 7 d
  min_ref: 30
  sensitivity_windows_hours: [24, 8760]   # D43 (B6): W = 1 d, 365 d
  guard_a_hours: 6                        # D41: S' = S - median(S of jobs ended in the 6 h before)

layer2:
  alpha: 0.1                              # PLAN 4.3
  alphas_curve: [0.05, 0.1, 0.2]          # FDR-vs-alpha plot (same e-values)
  kappas: [0.05, 0.1, 0.25, 0.5]          # PLAN 4.1 mixture
  jumper_J: 0.01                          # F14
  m_fixed: 980                            # D50: all PM100 nodes (random bases use all 980)
  eval_every_hours: 6                     # PLAN 4.3
  decoy_weight_hours: 24                  # D40 (B3): c_{u,n} over the 24 h before job start
  guard_b: {J: 0.01, ratio: 100.0}        # D56

baselines:                                # PLAN 4.4, D55
  window_days: 7
  every_days: 1
  b1: {median_rel_resid: 0.20, min_jobs: 10, min_users: 3, persist: 3}
  b2_top_frac: 0.05
  xgb_params: {}                          # Phase-1-style XGBRegressor defaults, frozen on pre-freeze rows

metrics:
  recall_horizon_days: 14                 # Gate 4b
  fdp_offsets_days: [7, 14]               # D57

gate4a:
  null_kind: null
  n_null_random: 200                      # D37
  se_mult: 2                              # alpha + 2 SE (D44, D54)
  guard_order: [a, b, none]               # D53

pilot:                                    # D48
  null_bases: 20
  node: {kind: node, base: random, K_pct: 1, s: 1.3, seeds: 5}
